[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "winnerz"
version = "1.2.18.10"
description = "A robust Python wrapper for high-performance PDF rendering and text extraction using C++ core."
readme = "readme.md"
authors = [
    { name = "Long Pham", email = "banhkha888@gmail.com" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Text Processing :: General",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/longpham2211/WinnerZ"
Repository = "https://github.com/longpham2211/WinnerZ"

[tool.scikit-build]
cmake.version = ">=3.10"
ninja.version = ">=1.10"

sdist.include = [
    "winnerz/**/*",
    "src/**/*",
    "include/**/*",
    "extract_text/**/*",
    "third-party/**/*",
    "CMakeLists.txt",
    "readme.md",
    "LICENSE"
]
sdist.exclude = [
    "build/**/*",
    "build-*/**/*",
    "test_venv/**/*",
    ".venv*/**/*",
    "cmap-resources-master/**/*",
    "data/**/*",
    "temp_uploads/**/*"
]
wheel.packages = []

[tool.cibuildwheel]
# Build all python versions
build = "*"
skip = "pp* *-musllinux* cp39-win_arm64 cp310-win_arm64 cp314*-win_arm64 *t-*"
test-requires = "pytest"
# test-command = "pytest {project}/tests"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "12.0" }

[tool.cibuildwheel.windows]
repair-wheel-command = ""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_34_x86_64"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_34_aarch64"
repair-wheel-command = "pip install wheel && python -c \"import sys, os, subprocess; w=sys.argv[1]; d=sys.argv[2]; p='manylinux_2_35_aarch64' if 'aarch64' in w else 'manylinux_2_35_x86_64'; out = subprocess.check_output(['wheel', 'tags', '--platform-tag', p, w]).decode().strip(); subprocess.run(['cp', os.path.join(os.path.dirname(w), out), d])\" {wheel} {dest_dir}"



